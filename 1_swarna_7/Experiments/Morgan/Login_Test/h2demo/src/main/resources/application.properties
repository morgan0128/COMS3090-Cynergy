spring.application.name=h2demo
server.port=8080
spring.h2.console.enabled=true

#this sets the database to H2 - in memory
spring.datasource.url=jdbc:h2:mem:testdb

#this sets the database admin username and password
spring.datasource.username=sa
spring.datasource.password=password

#this enables print of sql commands sent to the database
spring.jpa.properties.hibernate.show_sql=true

#this sets the console to print all messages upto DEBUG level
logging.level.org=DEBUG


#this use actuator to show mappings using /actuator/mappings
management.endpoints.web.exposure.include=*