<html>
<head>
  <title> Interest-based Chat</title>
</head>
<body>
  <h2>Interest based chatroom to simulate Synergy's Event Chats</h2>
  <table style="width: 100%">
    <tr>
      <td>
        <input type="text" id="wsserver"
          style="width: 15rem;"
          placeholder="ws://localhost:8080/chat/"
          value="ws://localhost:8080/chat/" />
      </td>
    </tr>
    <tr>
      <td>
        <input type="text" id="interest" placeholder="Interest (e.g. art, tech, hiking)" />
        <input type="text" id="username" placeholder="Username" />
        <button type="button" onclick="connect();">Join</button>
      </td>
    </tr>
    <tr>
      <td>
        <textarea readonly rows="10" cols="80" id="log"></textarea>
      </td>
    </tr>
    <tr>
      <td>
        <input type="text" size="51" id="msg" placeholder="Message" />
        <button type="button" onclick="send();">Send</button>
      </td>
    </tr>
  </table>
</body>

<script src="websocket.js"></script>

</html>
